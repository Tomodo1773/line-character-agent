name: Eval AGENT

# Foundry Evaluations の実行には Foundry プロジェクトへのアクセスが要るため、PR では動かさず手動起動とする。
# 必要な変数（vars.FOUNDRY_PROJECT_ENDPOINT など）が未設定の場合は評価スクリプトが起動時に失敗する。
on:
  workflow_dispatch:
    inputs:
      model:
        description: 評価するモデルのデプロイ名
        type: string
        default: Kimi-K2.6
      judge_model:
        description: 採点に使うモデルのデプロイ名（ジャッジ）
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python version
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.5.13"

      - name: Setup Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Install dependencies
        run: |
          cd src/agent
          sfw uv sync

      - name: azd のセットアップ
        uses: Azure/setup-azd@634ad924cf8baef2257898ba5663be8d19f15aca # v2.3.0

      - name: Azure へのログイン (OIDC)
        # DefaultAzureCredential は AzureDeveloperCliCredential を含むため、azd のログインをそのまま使える。
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: 評価を実行
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ inputs.model }}
          EVAL_JUDGE_DEPLOYMENT_NAME: ${{ inputs.judge_model }}
        run: |
          cd src/agent
          uv run python -m evals.run_eval
