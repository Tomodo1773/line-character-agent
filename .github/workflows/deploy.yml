name: Deploy to Azure (main)

# 継続デプロイは1ワークフロー・1ジョブにまとめる。Azure 認証と azd 環境の設定を
# 共有し、変更のあったものだけを条件付きでデプロイする。
# 初回構築（Agent identity と Cosmos RBAC の循環依存の解消）は scripts/bootstrap-azure.sh
# を手で流す。ここではその後の継続デプロイだけを扱う。
on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "src/agent/**"
      - "src/func/**"
      - "azure.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      provision:
        description: インフラを provision する
        type: boolean
        default: false
      deploy_agent:
        description: Agent をデプロイする
        type: boolean
        default: false
      deploy_func:
        description: Func をデプロイする
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # OIDC と azd 環境の識別子。Azure から導出できないので GitHub Variables に置く。
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # azd の管理外にある既存リソースと、日記の持ち主。これも Azure からは導出できない。
      AZURE_COSMOSDB_NAME: ${{ vars.AZURE_COSMOSDB_NAME }}
      AZURE_COSMOSDB_RG: ${{ vars.AZURE_COSMOSDB_RG }}
      AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
      AZURE_KEYVAULT_RG: ${{ vars.AZURE_KEYVAULT_RG }}
      DIARY_USER_ID: ${{ vars.DIARY_USER_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 変更検知
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            infra:
              - 'infra/**'
            agent:
              - 'src/agent/**'
            func:
              - 'src/func/**'
            azureyaml:
              - 'azure.yaml'

      - name: uv のセットアップ
        # Agent の prepackage hook が uv.lock から requirements.txt を書き出すために使う。
        # 依存の取得ではなく lockfile の書き出しだけなので sfw は要らない。
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.33"

      - name: azd のセットアップ
        uses: Azure/setup-azd@634ad924cf8baef2257898ba5663be8d19f15aca # v2.3.0

      - name: Azure へのログイン (OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: azd 環境を Azure から復元
        # CI の作業ディレクトリには azd 環境が残らないので、毎回 Bicep の output を取り直す。
        # provision を省略する実行はもちろん、provision する実行でも先に必要になる。
        # AZURE_AI_AGENT_PRINCIPAL_ID を空のまま provision すると、Agent への Cosmos の
        # ロール割り当てが消えてしまうため。
        run: azd env refresh --no-prompt

      - name: azd provision
        # Toolbox と Routine は Bicep ではなく azure.yaml のサービスとして作られるため、
        # azure.yaml の変更も provision の対象にする（infra/foundry/** は infra フィルタが拾う）。
        if: >-
          steps.changes.outputs.infra == 'true'
          || steps.changes.outputs.azureyaml == 'true'
          || inputs.provision
        run: azd provision --no-prompt

      - name: Agent をデプロイ
        if: >-
          steps.changes.outputs.agent == 'true'
          || steps.changes.outputs.infra == 'true'
          || steps.changes.outputs.azureyaml == 'true'
          || inputs.deploy_agent
        run: azd deploy agent --no-prompt

      - name: Func をデプロイ
        if: >-
          steps.changes.outputs.func == 'true'
          || steps.changes.outputs.infra == 'true'
          || steps.changes.outputs.azureyaml == 'true'
          || inputs.deploy_func
        run: azd deploy func --no-prompt
