[project]
name = "character-agent"
version = "0.1.0"
description = "Foundry hosted agent (Microsoft Agent Framework, Responses protocol)"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = "~=3.11.0"
readme = "README.md"
dependencies = [
    "agent-framework-foundry>=1.10.3",
    "agent-framework-foundry-hosting>=1.0.0b260722",
    "azure-ai-projects>=2.3.0",
    "azure-cosmos>=4.6.0,<5",
    "azure-identity>=1.25.3",
    "openai>=2.49.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"
prerelease = "allow"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 127
