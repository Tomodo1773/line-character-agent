[project]
name = "chatbot"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = "~=3.11.0"
readme = "README.md"
# LINE 経路は Phase 4 で src/func へ移った。ここに残るのは Phase 5 で
# ホステッドエージェントへ移植する日記検索ツールだけ。
dependencies = [
    "azure-cosmos>=4.6.0,<5",
    "langchain-core>=1.3.3,<2",
    "langchain-openai>=1.2.1,<2",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "debugpy>=1.8.17",
    "pytest>=8.4.2",
    "ruff>=0.15.12,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 127
