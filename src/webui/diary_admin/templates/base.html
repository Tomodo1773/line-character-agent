<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日記ビューア</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.7;
        margin: 0 auto;
        max-width: 48rem;
        padding: 1.5rem;
      }
      a {
        color: #06c;
      }
      h1 {
        font-size: 1.25rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        border-bottom: 1px solid #ddd;
        padding: 0.5rem 0;
      }
      .preview {
        color: #666;
        font-size: 0.9rem;
      }
      .content {
        background: #f6f6f6;
        border-radius: 0.25rem;
        padding: 1rem;
        white-space: pre-wrap;
      }
      form {
        display: inline;
      }
    </style>
  </head>
  <body>
    <h1><a href="/">日記ビューア</a></h1>
    {% block content %}{% endblock %}
  </body>
</html>
