[project]
name = "diary-admin"
version = "0.1.0"
description = "Diary admin web UI (Azure Container Apps Express)"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = "~=3.11.0"
readme = "README.md"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.41.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "azure-cosmos>=4.6.0,<5",
    "azure-identity>=1.25.3",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20,<0.16",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 127
