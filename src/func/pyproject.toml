[project]
name = "diary-rag"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = "~=3.11.0"
readme = "README.md"
dependencies = [
    "azure-functions>=1.21.3,<2",
    "python-dotenv>=1.0.0,<2",
    "deepagents>=0.6.12",
    "langchain-openai>=1.3.5",
    "line-bot-sdk>=3.25.0,<4",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ruff>=0.15.20,<0.16",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14.1",
    "debugpy>=1.8.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 127
