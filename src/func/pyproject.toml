[project]
name = "diary-rag"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = "~=3.11.0"
readme = "README.md"
dependencies = [
    "azure-functions>=1.21.3,<2",
    "python-dotenv>=1.0.0,<2",
    "line-bot-sdk>=3.25.0,<4",
    "azure-ai-projects>=2.3.0",
    "azure-cosmos>=4.6.0,<5",
    "azure-identity>=1.19.0,<2",
    "azure-monitor-opentelemetry>=1.6.0,<2",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ruff>=0.15.20,<0.16",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14.1",
    "debugpy>=1.8.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 127
